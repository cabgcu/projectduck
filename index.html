<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galactic Login - Hyperspeed Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #000;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }

        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .font-tech {
            font-family: 'Rajdhani', sans-serif;
        }

        .shimmer-wrapper {
            position: relative;
            padding: 2px;
            border-radius: 1.25rem; 
            background: linear-gradient(
                60deg, 
                #000000 0%,    
                #0a0a0a 25%,   
                #171717 45%,   
                #cbd5e1 50%,   
                #171717 55%,   
                #0a0a0a 75%,   
                #000000 100%   
            );
            background-size: 300% 300%;
            animation: glide-shimmer 7s ease-in-out infinite alternate;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
        }

        @keyframes glide-shimmer {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .glass-inner {
            background: rgba(0, 0, 0, 0.95); 
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: calc(1.25rem - 2px); 
            box-shadow: 
                inset 0 1px 1px rgba(255, 255, 255, 0.08), 
                inset 1px 0 1px rgba(255, 255, 255, 0.03), 
                inset 0 -1px 2px rgba(0, 0, 0, 0.9),       
                inset -1px 0 2px rgba(0, 0, 0, 0.9),       
                0 25px 50px -12px rgba(0, 0, 0, 1);       
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 
                inset 0 0 15px rgba(255, 255, 255, 0.05),
                0 4px 10px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }
        
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.5);
            outline: none;
            box-shadow: 
                inset 0 0 20px rgba(255, 255, 255, 0.1),
                0 0 15px rgba(255,255,255,0.15);
        }

        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #0a0a0a inset !important;
            -webkit-text-fill-color: white !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        /* Custom Checkbox styles */
        .custom-checkbox {
            appearance: none;
            background-color: rgba(255, 255, 255, 0.05);
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 1.25em;
            height: 1.25em;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 0.25em;
            display: grid;
            place-content: center;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }

        .custom-checkbox::before {
            content: "";
            width: 0.65em;
            height: 0.65em;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em #000;
            background-color: #000;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }

        .custom-checkbox:checked {
            background-color: #ffe81f;
            border-color: #ffe81f;
            box-shadow: 0 0 10px rgba(255, 232, 31, 0.5);
        }

        .custom-checkbox:checked::before {
            transform: scale(1);
        }
        
        /* Utility for smooth transitions */
        .fade-transition {
            transition: opacity 0.5s ease-in-out;
        }
    </style>
</head>
<body class="text-white antialiased selection:bg-gray-500/30">

    <canvas id="starfield"></canvas>

    <main class="relative z-10 min-h-screen w-full px-4 sm:px-6 flex justify-center items-center">
        
        <!-- LOGIN VIEW -->
        <div id="login-view" class="fade-transition opacity-100 w-full max-w-sm flex justify-center">
            <div class="shimmer-wrapper w-[380px]">
                <div class="glass-inner w-full h-full p-8 sm:p-10 flex flex-col items-center">
                    
                    <div class="flex flex-col items-center mb-2 w-full">
                        <img src="https://i.imgur.com/p2qZOL5.png" alt="Company Logo" class="w-20 h-auto -mb-4 object-contain relative z-10">
                        <img src="https://i.imgur.com/f4kE3Fg.png" alt="Galactic Logo" class="h-44 w-auto max-w-full object-contain drop-shadow-[0_0_15px_rgba(255,255,255,0.2)]">
                    </div>

                    <form onsubmit="event.preventDefault();" class="flex flex-col w-full">
                        <div class="relative w-full mb-6">
                            <label for="student-id" class="sr-only">Student ID</label>
                            <input 
                                type="text" 
                                id="student-id" 
                                placeholder="Student ID" 
                                class="glass-input w-full rounded-xl px-4 py-4 text-center text-[17px] text-white placeholder-gray-300/80 focus:placeholder-transparent"
                                required
                            >
                        </div>

                        <div class="mb-8 text-center">
                            <a href="#" class="text-[16px] text-gray-400 underline decoration-gray-500/50 underline-offset-[5px] hover:text-white hover:drop-shadow-[0_0_10px_rgba(255,255,255,0.7)] transition-all duration-300">
                                What is Duck Hunt?
                            </a>
                        </div>

                        <div class="flex gap-3 w-full">
                            <button 
                                type="button" 
                                onclick="navigate('login', 'home')"
                                class="flex-1 bg-white/5 border border-white/20 backdrop-blur-md hover:bg-white/10 hover:border-white/40 hover:shadow-[0_0_15px_rgba(255,255,255,0.1)] text-white font-bold text-[17px] py-4 rounded-xl transition-all duration-300 shadow-[0_4px_14px_rgba(0,0,0,0.8)] active:scale-[0.98]"
                            >
                                Sign In
                            </button>
                            <button 
                                type="button" 
                                onclick="navigate('login', 'register')"
                                class="flex-1 bg-[#ffe81f]/10 border border-[#ffe81f]/40 backdrop-blur-md hover:bg-[#ffe81f]/20 hover:border-[#ffe81f]/60 hover:shadow-[0_0_15px_rgba(255,232,31,0.3)] text-white font-bold text-[17px] py-4 rounded-xl transition-all duration-300 shadow-[0_4px_14px_rgba(0,0,0,0.8)] active:scale-[0.98]"
                            >
                                Register
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- REGISTER VIEW (Hidden Initially) -->
        <div id="register-view" class="hidden fade-transition opacity-0 w-full max-w-sm flex justify-center absolute">
            <div class="shimmer-wrapper w-[380px]">
                <div class="glass-inner w-full h-full p-8 sm:p-10 flex flex-col items-center">
                    
                    <div class="flex flex-col items-center mb-6 w-full">
                        <img src="https://i.imgur.com/f4kE3Fg.png" alt="Galactic Logo" class="h-16 w-auto object-contain drop-shadow-[0_0_15px_rgba(255,255,255,0.2)] mb-3">
                        <h2 class="text-2xl font-bold text-white text-center font-tech tracking-wider">Welcome To The Rescue!</h2>
                    </div>

                    <form onsubmit="event.preventDefault();" class="flex flex-col w-full gap-4">
                        
                        <input type="text" placeholder="First Name" class="glass-input w-full rounded-xl px-4 py-3 text-center text-[15px] text-white placeholder-gray-300/80 focus:placeholder-transparent" required>
                        <input type="text" placeholder="Last Name" class="glass-input w-full rounded-xl px-4 py-3 text-center text-[15px] text-white placeholder-gray-300/80 focus:placeholder-transparent" required>
                        <input type="text" placeholder="Student ID" class="glass-input w-full rounded-xl px-4 py-3 text-center text-[15px] text-white placeholder-gray-300/80 focus:placeholder-transparent" required>
                        <input type="email" placeholder="Email @my.gcu.edu" class="glass-input w-full rounded-xl px-4 py-3 text-center text-[15px] text-white placeholder-gray-300/80 focus:placeholder-transparent" required>

                        <div class="flex items-center gap-3 mt-2 mb-4 px-2">
                            <input type="checkbox" id="terms" class="custom-checkbox cursor-pointer" required>
                            <label for="terms" class="text-[14px] text-gray-300 cursor-pointer select-none leading-tight">
                                I agree to the <span class="text-white underline decoration-gray-500/50 underline-offset-2 hover:text-[#ffe81f] transition-colors">Terms & Conditions</span>
                            </label>
                        </div>

                        <div class="flex gap-3 w-full">
                            <button 
                                type="button" 
                                onclick="navigate('register', 'login')"
                                class="flex-1 bg-white/5 border border-white/20 backdrop-blur-md hover:bg-white/10 hover:border-white/40 hover:shadow-[0_0_15px_rgba(255,255,255,0.1)] text-white font-bold text-[16px] py-3 rounded-xl transition-all duration-300 shadow-[0_4px_14px_rgba(0,0,0,0.8)] active:scale-[0.98]"
                            >
                                Back
                            </button>
                            <button 
                                type="button" 
                                onclick="navigate('register', 'home')"
                                class="flex-1 bg-[#ffe81f]/10 border border-[#ffe81f]/40 backdrop-blur-md hover:bg-[#ffe81f]/20 hover:border-[#ffe81f]/60 hover:shadow-[0_0_15px_rgba(255,232,31,0.3)] text-white font-bold text-[16px] py-3 rounded-xl transition-all duration-300 shadow-[0_4px_14px_rgba(0,0,0,0.8)] active:scale-[0.98]"
                            >
                                Submit
                            </button>
                        </div>
                        
                    </form>
                </div>
            </div>
        </div>

        <!-- HOME PAGE PLACEHOLDER (Hidden Initially) -->
        <div id="home-view" class="hidden fade-transition opacity-0 flex flex-col items-center absolute text-center">
            <h1 class="text-4xl md:text-5xl font-bold font-tech text-white tracking-widest drop-shadow-[0_0_20px_rgba(255,255,255,0.5)] mb-4">
                HOME PAGE
            </h1>
            <p class="text-gray-400 text-lg">(To be built later...)</p>
            <button onclick="navigate('home', 'login')" class="mt-8 text-[#ffe81f] hover:text-white underline underline-offset-4 opacity-70 hover:opacity-100 transition-all">Go Back</button>
        </div>

    </main>

    <script>
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        let width, height, stars = [];
        const numStars = 400; 
        
        // Hyperspeed state
        let hyperspeedFactor = 0;
        let isHyperspeed = false;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', () => {
            resize();
            initStars();
        });

        class Star {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = Math.random() * width;
                this.y = initial ? Math.random() * height : -100; // Spawn higher up in case of warp
                this.z = Math.random() * 2 + 0.1; 
                this.radius = this.z * 0.7; 
                this.speed = (this.z * 0.5) + 0.1; 
                this.baseAlpha = (Math.random() * 0.5) + 0.3; 
                this.twinkleSpeed = (Math.random() * 0.02) + 0.005;
                this.alphaPhase = Math.random() * Math.PI * 2;
            }

            update() {
                // Incorporate hyperspeed multiplier (up to 80x speed based on depth)
                let currentSpeed = this.speed + (hyperspeedFactor * 80 * this.z);
                this.y += currentSpeed;

                // Normal twinkling when not in max hyperspeed
                if (hyperspeedFactor < 0.2) {
                    this.alphaPhase += this.twinkleSpeed;
                    this.currentAlpha = this.baseAlpha + (Math.sin(this.alphaPhase) * 0.2);
                    this.currentAlpha = Math.max(0, Math.min(1, this.currentAlpha));
                } else {
                    this.currentAlpha = 1; // Full brightness during warp
                }

                if (this.y > height + 10) {
                    this.reset();
                    // Spawn further back if warping to prevent blank gaps
                    if (hyperspeedFactor > 0.5) {
                        this.y = - (Math.random() * height);
                    }
                }
            }

            draw() {
                // Calculate stretch length for hyperspeed
                let stretch = hyperspeedFactor * 150 * this.z;

                if (stretch > 2) {
                    // Draw lines for hyperspeed effect
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(this.x, this.y - stretch);
                    ctx.strokeStyle = `rgba(255, 255, 255, ${this.currentAlpha})`;
                    ctx.lineWidth = this.radius * 1.5;
                    ctx.lineCap = "round";
                    ctx.stroke();
                } else {
                    // Draw standard dots
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${this.currentAlpha})`;
                    ctx.fill();
                }
            }
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < numStars; i++) {
                stars.push(new Star());
            }
        }

        function animate() {
            // Lower trail opacity for faster fading during warp
            let trail = isHyperspeed ? 0.4 : 0.8;
            ctx.fillStyle = `rgba(0, 0, 0, ${trail})`;
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < stars.length; i++) {
                stars[i].update();
                stars[i].draw();
            }

            requestAnimationFrame(animate);
        }

        // Hyperspeed animation trigger
        function triggerHyperspeed(onComplete) {
            isHyperspeed = true;
            const duration = 2200; // 2.2 seconds total warp
            const startTime = performance.now();
            
            function animateHyper(time) {
                const elapsed = time - startTime;
                if (elapsed < duration) {
                    // Smooth ease-in (power 3) and ease-out
                    if (elapsed < duration / 2) {
                        hyperspeedFactor = Math.pow(elapsed / (duration / 2), 3); 
                    } else {
                        hyperspeedFactor = Math.pow(1 - ((elapsed - duration / 2) / (duration / 2)), 3);
                    }
                    requestAnimationFrame(animateHyper);
                } else {
                    hyperspeedFactor = 0;
                    isHyperspeed = false;
                    if (onComplete) onComplete();
                }
            }
            requestAnimationFrame(animateHyper);
        }

        // Handle card transitions
        function navigate(fromTarget, toTarget) {
            const currentView = document.getElementById(fromTarget + '-view');
            const targetView = document.getElementById(toTarget + '-view');
            
            // 1. Fade out current view
            currentView.classList.remove('opacity-100');
            currentView.classList.add('opacity-0');
            
            // 2. Wait for fade, then hide it and start hyperspeed
            setTimeout(() => {
                currentView.classList.add('hidden');
                
                triggerHyperspeed(() => {
                    // 3. After hyperspeed, show target view
                    targetView.classList.remove('hidden');
                    
                    // Small delay to allow display:block to apply before animating opacity
                    setTimeout(() => {
                        targetView.classList.remove('opacity-0');
                        targetView.classList.add('opacity-100');
                    }, 50);
                });

            }, 500); // 500ms matches CSS transition duration
        }

        window.onload = function() {
            resize();
            initStars();
            animate();
        };
    </script>
</body>
</html>
